name: Release

# Sürüm etiketi (v*) itildiğinde: tam kontrol, derlenmiş paket (npm pack) ve GitHub Release.
# Kurulum derleme gerektirmez:
#   npm install -g https://github.com/frudotz/anafor-mcp/releases/latest/download/anafor-mcp.tgz
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Sürüm etiketle package.json eşleşmeli
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then echo "etiket $GITHUB_REF_NAME ≠ package.json $PKG"; exit 1; fi
      - name: Paket
        run: |
          npm pack
          cp "anafor-mcp-${GITHUB_REF_NAME#v}.tgz" anafor-mcp.tgz
          sha256sum anafor-mcp-*.tgz anafor-mcp.tgz > SHA256SUMS.txt
      - name: Paket bağımlılıklarını doğrula
        run: |
          tar -tzf anafor-mcp.tgz | grep -q '^package/node_modules/zod/package.json'
          npm install -g --prefix "$RUNNER_TEMP/p" --ignore-scripts --offline --cache "$RUNNER_TEMP/c" ./anafor-mcp.tgz && "$RUNNER_TEMP/p/bin/anafor" version
          npm audit --omit=dev --audit-level=high
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk "/^## \\[${GITHUB_REF_NAME#v}\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" anafor-mcp-*.tgz anafor-mcp.tgz SHA256SUMS.txt \
            --title "Anafor $GITHUB_REF_NAME" --notes "${NOTES:-Sürüm $GITHUB_REF_NAME}"
